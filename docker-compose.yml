name: microservice-deployment

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgresdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: practicedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d practicedb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - practice-network

  exam-service:
    image: manjusha07/practice-service:latest
    build:
      context: ./UserServiceProject
      dockerfile: Dockerfile
    container_name: practice-service
    ports:
      - "9001:8001"
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - practice-network

volumes:
  postgres_data:

networks:
  practice-network:
    driver: bridge